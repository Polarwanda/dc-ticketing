<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC Tickets</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1c1e21; }
  nav { background: #1f2937; padding: .8rem 1.2rem; }
  nav a { color: #fff; margin-right: 1.2rem; text-decoration: none; font-weight: 600; }
  main { max-width: 960px; margin: 1.2rem auto; padding: 0 1rem; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { padding: .5rem .6rem; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: .9rem; }
  .card { background: #fff; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; }
  .flash { padding: .6rem 1rem; border-radius: 6px; margin-bottom: .8rem; background: #dcfce7; }
  .flash.error { background: #fee2e2; }
  .warn { background: #fef3c7; padding: .6rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  .badge { padding: .1rem .55rem; border-radius: 999px; font-size: .75rem; color: #fff; }
  .on_track, .met { background: #16a34a; }
  .at_risk { background: #d97706; }
  .breached { background: #dc2626; }
  input, select, button { padding: .4rem; margin: .2rem 0; font: inherit; }
  label { display: block; margin-top: .5rem; font-weight: 600; font-size: .85rem; }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}">Tickets</a>
  <a href="{{ url_for('new') }}">New ticket</a>
  <a href="{{ url_for('assets') }}">Assets</a>
</nav>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
