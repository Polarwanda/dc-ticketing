{% extends "base.html" %}
{% block content %}
<h2>Assets</h2>
<form method="post" class="card">
  <input name="asset_tag" placeholder="Asset tag" required>
  <input name="name" placeholder="Name" required>
  <input name="site" placeholder="Site">
  <input name="rack" placeholder="Rack">
  <select name="feed"><option value="">Feed</option>{% for f in FEEDS %}<option>{{ f }}</option>{% endfor %}</select>
  <button>Add asset</button>
</form>
<div class="table-wrap">
<table>
  <tr><th>Tag</th><th>Name</th><th>Site</th><th>Rack</th><th>Feed</th><th>Active tickets</th></tr>
  {% for a in assets %}
  <tr>
    <td>{{ a.asset_tag }}</td><td>{{ a.name }}</td><td>{{ a.site or '-' }}</td>
    <td>{{ a.rack or '-' }}</td><td>{{ a.feed or '-' }}</td>
    <td><a href="{{ url_for('index', asset_tag=a.asset_tag) }}">{{ a.active_tickets }}</a></td>
  </tr>
  {% else %}
  <tr><td colspan="6">No assets yet.</td></tr>
  {% endfor %}
</table>
</div>
{% endblock %}
